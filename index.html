        function renderSearchResults(query) {
            const app = document.getElementById('app');
            app.innerHTML = '<div class="lesson-container"><h2 class="search-results-title">🔍 Kết quả tìm kiếm cho: "' + query + '"</h2><div id="search-results-content"></div></div>';
            const content = document.getElementById('search-results-content');
            
            let foundVocabs = [];
            let foundTrans = [];
            
            appData.forEach((lesson) => {
                if (lesson.vocab) {
                    lesson.vocab.forEach((word, vIndex) => {
                        const matchHanzi = word.hanzi && word.hanzi.toLowerCase().includes(query);
                        const matchPinyin = word.pinyin && word.pinyin.toLowerCase().includes(query);
                        const matchVi = word.vi && word.vi.toLowerCase().includes(query);
                        
                        let matchEx = false;
                        if (word.example) {
                            matchEx = (word.example.hanzi && word.example.hanzi.toLowerCase().includes(query)) ||
                                      (word.example.pinyin && word.example.pinyin.toLowerCase().includes(query)) ||
                                      (word.example.vi && word.example.vi.toLowerCase().includes(query));
                        }
                        
                        if (matchHanzi || matchPinyin || matchVi || matchEx) {
                            foundVocabs.push({ word, lessonNum: lesson.lesson, originalIndex: vIndex });
                        }
                    });
                }
                
                if (lesson.translations) {
                    lesson.translations.forEach((trans, tIndex) => {
                        const matchVi = trans.vi && trans.vi.toLowerCase().includes(query);
                        const matchZh = trans.zh && trans.zh.toLowerCase().includes(query);
                        if (matchVi || matchZh) {
                            foundTrans.push({ trans, lessonNum: lesson.lesson, originalIndex: tIndex });
                        }
                    });
                }
            });
            
            if (foundVocabs.length === 0 && foundTrans.length === 0) {
                content.innerHTML = '<p style="text-align:center; color:#888; font-style:italic;">Không tìm thấy kết quả nào phù hợp.</p>';
                return;
            }
            
            if (foundVocabs.length > 0) {
                let vocabHtml = `<h3 class="section-title">📚 Từ vựng & Mở rộng liên quan</h3><div class="grid">`;
                foundVocabs.forEach(item => {
                    const word = item.word;
                    let exampleHtml = '';
                    if(word.example) {
                        exampleHtml = `
                            <div class="example">
                                <div class="ex-hanzi">
                                    <span>${word.example.hanzi}</span>
                                    <span class="speaker-icon" onclick="event.stopPropagation(); speak('${word.example.hanzi}')">🔊</span>
                                </div>
                                <div class="ex-pinyin">${word.example.pinyin}</div>
                                <div class="ex-meaning">${word.example.vi}</div>
                            </div>
                        `;
                    }
                    vocabHtml += `
                        <div class="card" onclick="openStrokeModal('${word.hanzi}')" title="Click để xem cách viết">
                            <div class="card-actions">
                                <span class="btn-edit" title="Sửa từ này" onclick="event.stopPropagation(); editVocab(${item.lessonNum}, ${item.originalIndex})">✏️</span>
                                <span class="btn-del" title="Xóa từ này" onclick="event.stopPropagation(); deleteVocab(event, ${item.lessonNum}, ${item.originalIndex})">🗑️</span>
                            </div>
                            <div class="hanzi-row">
                                <div class="hanzi">${word.hanzi}</div>
                                <span class="speaker-icon" onclick="event.stopPropagation(); speak('${word.hanzi}')" title="Nghe phát âm">🔊</span>
                            </div>
                            <div class="pinyin">${word.pinyin || ''}</div>
                            <div class="meaning">${word.vi}</div>
                            <div style="font-size:0.8rem; color:var(--accent-color); margin-top:8px; font-weight:bold;">(Thuộc Bài ${item.lessonNum})</div>
                            ${exampleHtml}
                        </div>
                    `;
                });
                vocabHtml += `</div>`;
                content.innerHTML += vocabHtml;
            }
            
            if (foundTrans.length > 0) {
                let transHtml = `<div class="translation-section" style="margin-top: 30px;">
                    <h3 class="section-title">✍️ Mẫu câu luyện dịch liên quan</h3>
                `;
                foundTrans.forEach(item => {
                    const trans = item.trans;
                    const inputId = `search-input-L${item.lessonNum}-T${item.originalIndex}`;
                    const resId = `search-res-L${item.lessonNum}-T${item.originalIndex}`;
                    const cleanZh = trans.zh.replace(/[.,!?，。！？]/g, "").trim();
                    
                    transHtml += `
                        <div class="translation-item">
                            <div class="trans-actions">
                                <span class="btn-edit" title="Sửa câu này" onclick="editTranslation(${item.lessonNum}, ${item.originalIndex})">✏️</span>
                                <span class="btn-del" title="Xóa câu này" onclick="deleteTranslation(${item.lessonNum}, ${item.originalIndex})">🗑️</span>
                            </div>
                            <div style="font-size:0.85rem; color:var(--accent-color); margin-bottom:5px; font-weight:bold;">(Thuộc Bài ${item.lessonNum})</div>
                            <div class="trans-vi">${trans.vi}</div>
                            <div class="input-group">
                                <textarea id="${inputId}" class="trans-textarea" placeholder="Nhập câu tiếng Trung của bạn (Hán tự)..."></textarea>
                                <button class="btn-check" onclick="checkTranslation('${inputId}', '${resId}', '${cleanZh}')">Kiểm tra</button>
                                <button class="btn-show" onclick="showAnswer('${resId}', '${trans.zh}')">Xem đáp án</button>
                            </div>
                            <div id="${resId}" class="result-box"></div>
                        </div>
                    `;
                });
                transHtml += `</div>`;
                content.innerHTML += transHtml;
            }
        }
        
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        }
