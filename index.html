<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 2 TỔNG HỢP & BÀI TẬP DỊCH</title>
    <!-- Thêm thư viện Pinyin Pro để chuyển đổi Hán tự sang Pinyin -->
    <script src="https://unpkg.com/pinyin-pro"></script>
    <!-- HanziWriter library for stroke animations -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        :root {
            --accent-color: #c0392b;
            --bg-color: #f7f7f7;
            --text-main: #1a1a1a;
            --text-muted: #555555;
            --border-color: #e0e0e0;
            --success-color: #27ae60;
            --sidebar-width: 240px;
            --right-panel-width: 340px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            padding-left: var(--sidebar-width);
            padding-right: var(--right-panel-width);
            min-height: 100vh;
        }
        
        /* Left Sidebar Navigation */
        aside.left-panel {
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            padding: 20px 15px;
            z-index: 100;
        }
        aside.left-panel h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--accent-color);
            text-align: center;
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 10px;
        }
        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .nav-links a {
            display: block;
            padding: 8px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .nav-links a:hover, .nav-links a.active {
            background: var(--accent-color);
            color: #fff;
        }

        /* Right Panel */
        aside.right-panel {
            width: var(--right-panel-width);
            background: #fff;
            border-left: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            overflow-y: auto;
            padding: 20px 15px;
            z-index: 100;
            box-shadow: -2px 0 5px rgba(0,0,0,0.03);
        }
        aside.right-panel h2 {
            font-size: 1.1rem;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 10px;
        }
        .form-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #eee;
            margin-bottom: 25px;
        }
        .form-section h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #333;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.9rem;
        }
        
        .loading-text {
            font-size: 0.8rem;
            color: #2980b9;
            display: none;
            margin-top: 3px;
            font-style: italic;
        }

        .btn-submit {
            width: 100%;
            background: var(--success-color);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background: #219653;
        }
        .btn-reset {
            width: 100%;
            background: transparent;
            color: #999;
            border: 1px dashed #ccc;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 20px;
        }
        .btn-reset:hover { color: #e74c3c; border-color: #e74c3c; }

        /* Search Bar */
        .search-container {
            margin: 20px auto;
            max-width: 600px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 2px 8px rgba(192, 57, 43, 0.2);
        }
        .search-input { padding-right: 40px; }
        .clear-search-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: #999;
            cursor: pointer;
            display: none;
        }
        .clear-search-btn:hover { color: var(--accent-color); }

        .search-results-title {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 10px;
        }

        /* Main Content */
        main {
            flex-grow: 1;
            padding: 40px;
            width: 100%;
            max-width: 1400px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: sticky;
            top: 0;
            background: var(--bg-color);
            z-index: 95;
            padding: 20px 20px 15px 20px;
            margin: -40px -40px 40px -40px;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        h1 { 
            font-weight: 300; 
            font-size: 2.2rem; 
            margin-bottom: 20px; 
            letter-spacing: -1px; 
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        button {
            background: transparent;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            padding: 8px 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        button.action-btn:hover, button.action-btn.active {
            background: var(--text-main);
            color: #fff;
        }
        .lesson-container { 
            margin-bottom: 50px; 
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            scroll-margin-top: 20px;
        }
        .lesson-title {
            font-size: 1.5rem;
            font-weight: 500;
            margin: 0 0 25px;
            border-left: 5px solid var(--accent-color);
            padding-left: 15px;
        }
        
        h3.section-title { margin-bottom: 20px; font-weight: 500; color: var(--text-main); font-size: 1.2rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: #fafafa;
            padding: 18px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover { border-color: var(--accent-color); }
        .hanzi-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .hanzi { font-size: 2.2rem; font-weight: 400; color: var(--text-main); }
        .speaker-icon {
            cursor: pointer;
            font-size: 1.3rem;
            opacity: 0.4;
            transition: opacity 0.2s, color 0.2s;
            user-select: none;
        }
        .speaker-icon:hover { opacity: 1; color: var(--accent-color); }
        
        .pinyin { font-size: 1.25rem; color: var(--accent-color); margin-bottom: 8px; }
        .meaning { font-size: 1.15rem; font-weight: 500; flex-grow: 1; }
        
        .example {
            margin-top: 12px;
            background: #fff;
            padding: 10px;
            border: 1px dashed #ccc;
            border-radius: 4px;
        }
        .ex-hanzi { font-size: 1.1rem; display:flex; justify-content:space-between; margin-bottom:4px; }
        .ex-pinyin { color: var(--text-muted); font-weight: 300; margin-bottom: 4px; font-size: 1rem; }
        .ex-meaning { color: var(--text-main); font-style: italic; font-size: 1rem; }
        
        .hide-pinyin .pinyin, .hide-pinyin .ex-pinyin { opacity: 0; pointer-events: none; }
        .hide-meaning .meaning, .hide-meaning .ex-meaning { opacity: 0; pointer-events: none; }
        .hide-pinyin .card:hover .pinyin, .hide-pinyin .card:hover .ex-pinyin { opacity: 1; }
        .hide-meaning .card:hover .meaning, .hide-meaning .card:hover .ex-meaning { opacity: 1; }

        .translation-section {
            background: #f9fbfd;
            border: 1px solid #d1e3f8;
            padding: 25px;
            border-radius: 6px;
        }
        .translation-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        .translation-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .trans-vi { font-size: 1.2rem; font-weight: 500; margin-bottom: 12px; color: #1a1a1a; }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .trans-textarea {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 45px;
        }
        .btn-check, .btn-show {
            background: var(--text-main);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-show { background: #7f8c8d; }
        .btn-check:hover { background: var(--accent-color); }
        .btn-show:hover { background: #34495e; }
        
        /* Modal & Admin Action styles */
        .card { position: relative; cursor: pointer; }
        .card-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 1rem;
            opacity: 0.3;
            transition: opacity 0.2s;
            z-index: 2;
            display: flex;
            gap: 6px;
        }
        .card:hover .card-actions { opacity: 1; }
        .card-actions span { cursor: pointer; }
        .card-actions .btn-edit:hover { color: #2980b9; }
        .card-actions .btn-del:hover { color: #c0392b; }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            max-width: 90%;
            min-width: 300px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #888;
        }
        .close-modal:hover { color: #333; }
        #stroke-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .hanzi-box {
            width: 120px;
            height: 120px;
            border: 1px dashed #ccc;
            border-radius: 4px;
            background: #fdfdfd;
        }
        .btn-animate {
            background: var(--text-main);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-animate:hover { background: var(--accent-color); }
        
        .result-box {
            margin-top: 12px;
            padding: 12px;
            border-radius: 4px;
            display: none;
            font-size: 1.05rem;
        }
        .result-box.correct {
            display: block;
            background: #e8f8f5;
            color: #27ae60;
            border: 1px solid #a3e4d7;
        }
        .result-box.show-answer {
            display: block;
            background: #fdf2e9;
            color: #d35400;
            border: 1px solid #f5cba7;
        }
        .trans-actions {
            float: right;
            font-size: 1.1rem;
            opacity: 0.5;
        }
        .trans-actions span {
            cursor: pointer;
            margin-left: 12px;
            transition: opacity 0.2s, color 0.2s;
        }
        .trans-actions span:hover { opacity: 1; }
        .trans-actions .btn-edit:hover { color: #2980b9; }
        .trans-actions .btn-del:hover { color: #c0392b; }

        @media (max-width: 1200px) {
            body { flex-direction: column; padding-left: 0; padding-right: 0; align-items: center; }
            aside.left-panel, aside.right-panel {
                position: relative;
                width: 100%;
                height: auto;
                border: none;
                border-bottom: 1px solid var(--border-color);
                box-shadow: none;
            }
            .nav-links {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .nav-links a {
                padding: 5px 10px;
                font-size: 0.85rem;
            }
            main {
                margin-left: 0;
                padding: 20px;
            }
            .grid { grid-template-columns: 1fr; }
            .input-group { flex-direction: column; }
        }
    
        /* Hide admin controls by default */
        .card-actions { display: none !important; }
        .trans-actions { display: none !important; }
        
        /* Show admin controls only when logged in */
        body.is-admin .card-actions { display: flex !important; }
        body.is-admin .trans-actions { display: block !important; float: right; }
    </style>

    <!-- Thêm thư viện Google Identity Services cho Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <aside class="left-panel">
        <h2>CHỌN BÀI HỌC</h2>
        <ul class="nav-links" id="nav-list"></ul>
    </aside>

    <main>
        <header>
            <h1 style="margin-top: 5px;">HSK 2 TỔNG HỢP & BÀI TẬP DỊCH</h1>
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Tìm kiếm từ vựng, mẫu câu (Hán tự, Pinyin, Tiếng Việt)...">
                <button id="clear-search-btn" class="clear-search-btn" title="Xóa tìm kiếm">&times;</button>
            </div>
            <div class="controls">
                <button class="action-btn" id="toggle-pinyin">Che Pinyin</button>
                <button class="action-btn" id="toggle-meaning">Che Nghĩa</button>
            </div>
        </header>
        
        <div id="app"></div>
    </main>

    <!-- Modal cho Hướng dẫn viết chữ -->
    <div id="stroke-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeStrokeModal()">&times;</span>
            <h3 id="stroke-word" style="font-size: 1.5rem; color: var(--accent-color); margin-bottom: 10px;"></h3>
            <p style="color: #666; font-size: 0.9rem;">(Thứ tự nét chữ)</p>
            <div id="stroke-container"></div>
            <button class="btn-animate" onclick="animateAllStrokes()">Viết lại</button>
        </div>
    </div>

    <aside class="right-panel">
        <h2>THÊM DỮ LIỆU</h2>
        
        <div id="login-section" style="text-align: center; margin-top: 30px;">
            <p style="font-size: 0.9rem; color: #555; margin-bottom: 15px;">Đăng nhập để thêm/sửa dữ liệu</p>
            <!-- Nút đăng nhập Google -->
            <div id="g_id_onload"
                 data-client_id="964510640088-or6gu50cooa8pccmcoalil9p34pim98r.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="center">
            </div>
            <p id="login-error" style="color: var(--accent-color); font-size: 0.85rem; margin-top: 15px; display: none;"></p>
        </div>

        <div id="admin-panel" style="display: none;">
            <div class="form-section">
                <h3>📖 Thêm Từ Mới</h3>
                <div class="form-group">
                    <label>Chọn Bài Học</label>
                    <select id="vocab-lesson"></select>
                </div>
                <div class="form-group">
                    <label>Hán tự * <span style="font-weight: normal; color: #888;">(Nhập xong click ra ngoài để tự động điền)</span></label>
                    <input type="text" id="vocab-hanzi" placeholder="VD: 漂亮 (nhấn Tab hoặc click ra ngoài)">
                    <div id="loading-msg" class="loading-text">⏳ Đang tự động dịch và lấy Pinyin...</div>
                </div>
                <div class="form-group">
                    <label>Pinyin (Tự động điền)</label>
                    <input type="text" id="vocab-pinyin" placeholder="VD: piàoliang">
                </div>
                <div class="form-group">
                    <label>Nghĩa tiếng Việt (Tự động điền)</label>
                    <input type="text" id="vocab-vi" placeholder="VD: đẹp">
                </div>
                <button class="btn-submit" onclick="addVocabulary()">Thêm Từ Mới</button>
            </div>

            <div class="form-section">
                <h3>✍️ Thêm Câu Dịch</h3>
                <div class="form-group">
                    <label>Chọn Bài Học</label>
                    <select id="trans-lesson"></select>
                </div>
                <div class="form-group">
                    <label>Câu tiếng Việt *</label>
                    <textarea id="trans-vi" placeholder="Nhập câu tiếng Việt..."></textarea>
                </div>
                <div class="form-group">
                    <label>Câu tiếng Trung (Đáp án) *</label>
                    <textarea id="trans-zh" placeholder="Nhập Hán tự..."></textarea>
                </div>
                <button class="btn-submit" onclick="addTranslation()">Thêm Câu Dịch</button>
            </div>
            
            <button class="btn-reset" onclick="resetData()">Khôi phục dữ liệu gốc</button>
            <button class="btn-reset" onclick="logoutAdmin()" style="margin-top: 10px; border-color: #3498db; color: #3498db;">Đăng xuất tài khoản</button>
        </div>
    </aside>

    <script>
        const INITIAL_DATA = [{"lesson":1,"title":"九月去北京旅游最好 (Tháng 9 đi du lịch Bắc Kinh là tuyệt nhất)","vocab":[{"hanzi":"旅游","pinyin":"lǚyóu","vi":"du lịch","example":{"hanzi":"九月去北京旅游最好。","pinyin":"Jiǔ yuè qù Běijīng lǚyóu zuì hǎo.","vi":"Tháng 9 đi du lịch Bắc Kinh là tốt nhất."}},{"hanzi":"觉得","pinyin":"juéde","vi":"cảm thấy, cho rằng","example":{"hanzi":"你觉得什么时候去最好？","pinyin":"Nǐ juéde shénme shíhou qù zuì hǎo?","vi":"Bạn thấy đi khi nào là tốt nhất?"}},{"hanzi":"最","pinyin":"zuì","vi":"nhất","example":{"hanzi":"我最喜欢踢足球。","pinyin":"Wǒ zuì xǐhuan tī zúqiú.","vi":"Tôi thích đá bóng nhất."}},{"hanzi":"为什么","pinyin":"wèi shénme","vi":"tại sao","example":{"hanzi":"为什么不想去？","pinyin":"Wèi shénme bù xiǎng qù?","vi":"Tại sao không muốn đi?"}},{"hanzi":"也","pinyin":"yě","vi":"cũng","example":{"hanzi":"天气不冷也不热。","pinyin":"Tiānqì bù lěng yě bú rè.","vi":"Thời tiết không lạnh cũng không nóng."}},{"hanzi":"运动","pinyin":"yùndòng","vi":"vận động, thể thao","example":{"hanzi":"你喜欢什么运动？","pinyin":"Nǐ xǐhuan shénme yùndòng?","vi":"Bạn thích môn thể thao nào?"}},{"hanzi":"踢足球","pinyin":"tī zúqiú","vi":"đá bóng","example":{"hanzi":"我们一起去踢足球吧。","pinyin":"Wǒmen yìqǐ qù tī zúqiú ba.","vi":"Chúng ta cùng đi đá bóng nhé."}},{"hanzi":"一起","pinyin":"yìqǐ","vi":"cùng nhau","example":{"hanzi":"我们一起去买椅子。","pinyin":"Wǒmen yìqǐ qù mǎi yǐzi.","vi":"Chúng ta cùng đi mua ghế."}},{"hanzi":"要","pinyin":"yào","vi":"muốn, cần","example":{"hanzi":"我要去北京旅游。","pinyin":"Wǒ yào qù Běijīng lǚyóu.","vi":"Tôi muốn đi du lịch Bắc Kinh."}},{"hanzi":"新","pinyin":"xīn","vi":"mới","example":{"hanzi":"我要买几个新的椅子。","pinyin":"Wǒ yào mǎi jǐ ge xīn de yǐzi.","vi":"Tôi muốn mua vài cái ghế mới."}},{"hanzi":"它","pinyin":"tā","vi":"nó (chỉ vật, con vật)","example":{"hanzi":"它叫花花。","pinyin":"Tā jiào Huāhua.","vi":"Nó tên là Hoa Hoa."}},{"hanzi":"眼睛","pinyin":"yǎnjing","vi":"mắt","example":{"hanzi":"我觉得它的眼睛最漂亮。","pinyin":"Wǒ juéde tā de yǎnjing zuì piàoliang.","vi":"Tôi thấy đôi mắt của nó đẹp nhất."}},{"hanzi":"从来","pinyin":"cónglái","vi":"từ trước đến nay"},{"hanzi":"提","pinyin":"tí","vi":"nhắc đến"}],"translations":[{"vi":"Bạn cảm thấy tháng mấy đi du lịch Hồ Chí Minh là đẹp nhất?","zh":"你觉得几月去胡志明市旅游最好？"},{"vi":"Tại sao bạn muốn học tiếng trung?","zh":"你为什么想学习中文？"},{"vi":"Bạn tôi rất thích chơi đá bóng, tôi cũng vậy.","zh":"我的朋友很喜欢踢足球， 我也是。"},{"vi":"Mắt con mèo của tôi rất đẹp.","zh":"我的猫眼睛很漂亮。"},{"vi":"Cái máy tính mới của tôi rất tốt.","zh":"我的新电脑很好。"},{"vi":"Tôi rất thích đi du lịch, năm nay tôi muốn đi du lịch Trung Quốc.","zh":"我很喜欢去旅游，今年我想去中国旅游。"},{"vi":"Mắt con cún của tôi rất đẹp, nó năm niên hơn 2 tuổi rồi.","zh":"我的狗眼睛很漂亮，它今年两岁多了。"},{"vi":"Tại sao hôm nay bạn không đi học?","zh":"为什么今天你不去学校？"},{"vi":"Sức khỏe tôi không tốt / Tôi không khỏe.","zh":"我身体不好啊。"},{"vi":"Máy tính mới của tôi là mẹ mua cho tôi.","zh":"我的新电脑是妈妈给我买的。"},{"vi":"Chúng tôi quen biết nhau hơn 10 năm rồi.","zh":"我们认识10多年了。"}]},{"lesson":2,"title":"我每天六点起床 (Hàng ngày tôi thức dậy lúc 6 giờ)","vocab":[{"hanzi":"生病","pinyin":"shēng bìng","vi":"bị bệnh, ốm","example":{"hanzi":"你很少生病。","pinyin":"Nǐ hěn shǎo shēng bìng.","vi":"Bạn rất ít khi bị ốm."}},{"hanzi":"每","pinyin":"měi","vi":"mỗi","example":{"hanzi":"我每天六点起床。","pinyin":"Wǒ měi tiān liù diǎn qǐ chuáng.","vi":"Mỗi ngày tôi dậy lúc 6 giờ."}},{"hanzi":"早上","pinyin":"zǎoshang","vi":"buổi sáng","example":{"hanzi":"我每天早上出去跑步。","pinyin":"Wǒ měi tiān zǎoshang chūqù pǎo bù.","vi":"Mỗi sáng tôi đều ra ngoài chạy bộ."}},{"hanzi":"跑步","pinyin":"pǎo bù","vi":"chạy bộ","example":{"hanzi":"跑步对身体好。","pinyin":"Pǎo bù duì shēntǐ hǎo.","vi":"Chạy bộ rất tốt cho sức khỏe."}},{"hanzi":"起床","pinyin":"qǐ chuáng","vi":"thức dậy","example":{"hanzi":"你每天几点起床？","pinyin":"Nǐ měi tiān jǐ diǎn qǐ chuáng.","vi":"Bạn thức dậy lúc mấy giờ mỗi ngày?"}},{"hanzi":"药","pinyin":"yào","vi":"thuốc","example":{"hanzi":"你吃药了吗？","pinyin":"Nǐ chī yào le ma?","vi":"Bạn đã uống thuốc chưa?"}},{"hanzi":"身体","pinyin":"shēntǐ","vi":"cơ thể, sức khỏe","example":{"hanzi":"现在身体怎么样？","pinyin":"Xiànzài shēntǐ zěnmeyàng?","vi":"Bây giờ sức khỏe thế nào rồi?"}},{"hanzi":"出院","pinyin":"chū yuàn","vi":"xuất viện","example":{"hanzi":"什么时候能出院？","pinyin":"Shénme shíhou néng chū yuàn?","vi":"Khi nào thì có thể xuất viện?"}},{"hanzi":"高","pinyin":"gāo","vi":"cao","example":{"hanzi":"大卫今年多高？","pinyin":"Dàwèi jīnnián duō gāo?","vi":"David năm nay cao bao nhiêu?"}},{"hanzi":"米","pinyin":"mǐ","vi":"mét","example":{"hanzi":"他一米八几。","pinyin":"Tā yì mǐ bā jǐ.","vi":"Anh ấy cao một mét tám mấy."}},{"hanzi":"知道","pinyin":"zhīdào","vi":"biết","example":{"hanzi":"你怎么知道这么多啊？","pinyin":"Nǐ zěnme zhīdào zhème duō a?","vi":"Sao bạn biết nhiều thế?"}},{"hanzi":"休息","pinyin":"xiūxi","vi":"nghỉ ngơi","example":{"hanzi":"他没有时间休息。","pinyin":"Tā méiyǒu shíjiān xiūxi.","vi":"Anh ấy không có thời gian nghỉ ngơi."}},{"hanzi":"忙","pinyin":"máng","vi":"bận","example":{"hanzi":"张老师这几天很忙。","pinyin":"Zhāng lǎoshī zhè jǐ tiān hěn máng.","vi":"Thầy Trương mấy ngày nay rất bận."}},{"hanzi":"时间","pinyin":"shíjiān","vi":"thời gian","example":{"hanzi":"我没有时间看电影。","pinyin":"Wǒ méiyǒu shíjiān kàn diànyǐng.","vi":"Tôi không có thời gian xem phim."}},{"hanzi":"医院","pinyin":"yīyuàn","vi":"bệnh viện"},{"hanzi":"药房","pinyin":"yàofáng","vi":"nhà thuốc"},{"hanzi":"咖啡店","pinyin":"kāfēi diàn","vi":"quán cà phê"}],"translations":[{"vi":"Mỗi ngày tôi đều thức dậy lúc 6h sáng, chạy bộ, nấu ăn.","zh":"我每天都早上六点起床，跑步，做饭。"},{"vi":"Sức khỏe của anh ấy không tốt nên hôm hôm nay tôi đi bệnh viện thăm anh ấy.","zh":"他的身体不好，所以我今天去医院看他。"},{"vi":"Bác sĩ nói khi nào bạn có thể xuất viện?","zh":"医生说你什么时候可以出院？"},{"vi":"Tôi cao 1 mét 75, em trai tôi cao 1m 8.","zh":"我身高一米七十五，我弟弟身高一米八。"},{"vi":"Hôm nay tôi rất bận không có thời gian nghỉ ngơi.","zh":"今天我很忙，没有时间休息。"},{"vi":"10 năm không gặp, bạn bây giờ làm công việc gì rồi? Tôi làm việc ở bệnh viện.","zh":"十年不见你现在做什么工作了？我在医院工作呢。"},{"vi":"Thời tiết nóng quá, mẹ tôi bị bệnh rồi. Tôi phải đi nhà thuốc mua thuốc cho bà ấy.","zh":"天气太热了，我妈妈生病了，我要去药房给她买药。"},{"vi":"Bạn chạy bộ 30 phút rồi, nghỉ 1 xíu đi.","zh":"你跑步30分钟了，休息一下啊吧。"},{"vi":"Hôm nay tôi rất bận, không có thời gian đi cafe với bạn.","zh":"今天我很忙，没有时间跟你去咖啡店。"},{"vi":"Tôi không thích chạy bộ, tôi thích đá banh.","zh":"我不喜欢跑步，我喜欢踢足球。"}]},{"lesson":3,"title":"左边那个红色的是我的 (Cái màu đỏ bên trái là của tôi)","vocab":[{"hanzi":"手表","pinyin":"shǒubiǎo","vi":"đồng hồ đeo tay","example":{"hanzi":"这块手表是你的吗？","pinyin":"Zhè kuài shǒubiǎo shì nǐ de ma?","vi":"Chiếc đồng hồ này là của bạn phải không?"}},{"hanzi":"千","pinyin":"qiān","vi":"nghìn","example":{"hanzi":"三千多块。","pinyin":"Sānqiān duō kuài.","vi":"Hơn ba nghìn đồng."}},{"hanzi":"报纸","pinyin":"bàozhǐ","vi":"báo","example":{"hanzi":"这是今天早上的报纸吗？","pinyin":"Zhè shì jīntiān zǎoshang de bàozhǐ ma?","vi":"Đây là báo sáng nay à?"}},{"hanzi":"送","pinyin":"sòng","vi":"giao, đưa, tặng","example":{"hanzi":"是送报纸的来了吗？","pinyin":"Shì sòng bàozhǐ de lái le ma?","vi":"Là người giao báo đến phải không?"}},{"hanzi":"一下","pinyin":"yíxià","vi":"một chút, thử","example":{"hanzi":"我看一下。","pinyin":"Wǒ kàn yíxià.","vi":"Để tôi xem thử."}},{"hanzi":"牛奶","pinyin":"niúnǎi","vi":"sữa bò","example":{"hanzi":"是送牛奶的。","pinyin":"Shì sòng niúnǎi de.","vi":"Là người giao sữa."}},{"hanzi":"房间","pinyin":"fángjiān","vi":"phòng","example":{"hanzi":"这是谁的房间？","pinyin":"Zhè shì shéi de fángjiān?","vi":"Đây là phòng của ai?"}},{"hanzi":"丈夫","pinyin":"zhàngfu","vi":"chồng","example":{"hanzi":"这是我和我丈夫的。","pinyin":"Zhè shì wǒ hé wǒ zhàngfu de.","vi":"Đây là của tôi và chồng tôi."}},{"hanzi":"旁边","pinyin":"pángbiān","vi":"bên cạnh","example":{"hanzi":"旁边那个小的房间是我女儿的。","pinyin":"Pángbiān nàge xiǎo de fángjiān shì wǒ nǚ'ér de.","vi":"Phòng nhỏ bên cạnh là của con gái tôi."}},{"hanzi":"真","pinyin":"zhēn","vi":"thật, quả là","example":{"hanzi":"你女儿的房间真漂亮！","pinyin":"Nǐ nǚ'ér de fángjiān zhēn piàoliang!","vi":"Phòng con gái bạn thật đẹp!"}},{"hanzi":"粉色","pinyin":"fěnsè","vi":"màu hồng","example":{"hanzi":"都是粉色的。","pinyin":"Dōu shì fěnsè de.","vi":"Toàn là màu hồng."}},{"hanzi":"颜色","pinyin":"yánsè","vi":"màu sắc","example":{"hanzi":"粉色是我女儿最喜欢的颜色。","pinyin":"Fěnsè shì wǒ nǚ'ér zuì xǐhuan de yánsè.","vi":"Màu hồng là màu con gái tôi thích nhất."}},{"hanzi":"左边","pinyin":"zuǒbian","vi":"bên trái","example":{"hanzi":"左边那个红色的是我的。","pinyin":"Zuǒbian nàge hóngsè de shì wǒ de.","vi":"Cái màu đỏ bên trái là của tôi."}},{"hanzi":"红色","pinyin":"hóngsè","vi":"màu đỏ","example":{"hanzi":"红色的杯子是你的吗？","pinyin":"Hóngsè de bēizi shì nǐ de ma?","vi":"Cốc màu đỏ là của bạn phải không?"}},{"hanzi":"粉色","pinyin":"fěnsè","vi":"màu hồng"},{"hanzi":"蓝色","pinyin":"lánsè","vi":"màu xanh lam"}],"translations":[{"vi":"Chiếc đồng hồ này là của bạn hả, đắt không?","zh":"这块手表是你的吗？贵吗？"},{"vi":"Bạn thích màu gì? Tôi thích màu hồng và đỏ.","zh":"你喜欢什么颜色？我喜欢粉色和红色。"},{"vi":"Bố bạn có thích đọc báo không? Bố tôi rất ít đọc báo.","zh":"你爸爸喜欢看报纸吗？我爸爸很少看报纸。"},{"vi":"Phòng của bạn màu gì? Phòng của tôi màu xanh lam.","zh":"你的房间是什么颜色？ 我的房间蓝色。"},{"vi":"Sau khi ăn cơm tôi muốn xem tivi một chút.","zh":"吃饭后我想看电视一下。"},{"vi":"Cái đồng hồ của tôi là 5 ngàn tệ.","zh":"我的手表是五千块钱。"},{"vi":"Phòng của tôi rất nhỏ, phòng bạn thì sao?","zh":"我的房间很小，你的呢？"},{"vi":"Mắt của bạn thật đẹp.","zh":"你的眼睛真漂亮啊。"},{"vi":"Ăn cơm xong chúng tôi đi ra ngoài 1 chút.","zh":"吃饭后我们出去一下。"},{"vi":"Tôi thích rất nhiều màu sắc.","zh":"我喜欢很多颜色。"}]},{"lesson":4,"title":"这个工作是他帮我介绍的 (Công việc này là anh ấy giới thiệu cho tôi)","vocab":[{"hanzi":"生日","pinyin":"shēngrì","vi":"sinh nhật","example":{"hanzi":"生日快乐！","pinyin":"Shēngrì kuàilè!","vi":"Chúc mừng sinh nhật!"}},{"hanzi":"快乐","pinyin":"kuàilè","vi":"vui vẻ","example":{"hanzi":"新年快乐！","pinyin":"Xīnnián kuàilè!","vi":"Chúc mừng năm mới!"}},{"hanzi":"给","pinyin":"gěi","vi":"cho, tặng","example":{"hanzi":"这是送给你的！","pinyin":"Zhè shì sòng gěi nǐ de!","vi":"Đây là tặng cho bạn!"}},{"hanzi":"接","pinyin":"jiē","vi":"nhận, nghe (điện thoại)","example":{"hanzi":"电话是儿子接的。","pinyin":"Diànhuà shì érzi jiē de.","vi":"Điện thoại do con trai nghe."}},{"hanzi":"晚上","pinyin":"wǎnshang","vi":"buổi tối","example":{"hanzi":"晚上我问一下儿子。","pinyin":"Wǎnshang wǒ wèn yíxià érzi.","vi":"Buổi tối tôi sẽ hỏi con trai một chút."}},{"hanzi":"问","pinyin":"wèn","vi":"hỏi","example":{"hanzi":"去问老师。","pinyin":"Qù wèn lǎoshī.","vi":"Đi hỏi giáo viên."}},{"hanzi":"非常","pinyin":"fēicháng","vi":"vô cùng, rất","example":{"hanzi":"非常喜欢。","pinyin":"Fēicháng xǐhuan.","vi":"Rất thích."}},{"hanzi":"开始","pinyin":"kāishǐ","vi":"bắt đầu","example":{"hanzi":"什么时候开始的？","pinyin":"Shénme shíhou kāishǐ de?","vi":"Bắt đầu từ khi nào?"}},{"hanzi":"已经","pinyin":"yǐjīng","vi":"đã","example":{"hanzi":"已经踢了十年了。","pinyin":"Yǐjīng tī le shí nián le.","vi":"Đã đá được mười năm rồi."}},{"hanzi":"长","pinyin":"cháng","vi":"dài, lâu","example":{"hanzi":"多长时间了？","pinyin":"Duō cháng shíjiān le?","vi":"Bao lâu rồi?"}},{"hanzi":"两","pinyin":"liǎng","vi":"hai","example":{"hanzi":"已经两年多了。","pinyin":"Yǐjīng liǎng nián duō le.","vi":"Đã hơn hai năm rồi."}},{"hanzi":"帮","pinyin":"bāng","vi":"giúp","example":{"hanzi":"他帮我找工作。","pinyin":"Tā bāng wǒ zhǎo gōngzuò.","vi":"Anh ấy giúp tôi tìm việc."}},{"hanzi":"介绍","pinyin":"jièshào","vi":"giới thiệu","example":{"hanzi":"这个工作是他帮我介绍的。","pinyin":"Zhège gōngzuò shì tā bāng wǒ jièshào de.","vi":"Công việc này do anh ấy giới thiệu giúp."}},{"hanzi":"中部","pinyin":"zhōngbù","vi":"miền Trung"},{"hanzi":"北部","pinyin":"běibù","vi":"miền Bắc"},{"hanzi":"出差","pinyin":"chūchāi","vi":"đi công tác"},{"hanzi":"泰语","pinyin":"Tàiyǔ","vi":"tiếng Thái"},{"hanzi":"沟通","pinyin":"gōutōng","vi":"giao tiếp, liên lạc"},{"hanzi":"小学","pinyin":"xiǎoxué","vi":"tiểu học"},{"hanzi":"初中","pinyin":"chūzhōng","vi":"trung học"},{"hanzi":"高中","pinyin":"gāozhōng","vi":"cấp 3"},{"hanzi":"看病","pinyin":"kàn bìng","vi":"khám bệnh"}],"translations":[{"vi":"Sinh nhật vui vẻ, tối nay tôi tới nhà đón bạn đi nhà hàng ăn tối.","zh":"生日快乐. 今天晚上我来你家接你，去饭店吃晚饭。"},{"vi":"Tôi đã sống ở Hà Nội hơn 10 năm rồi, tôi vô cùng thích thời tiết ở đây.","zh":"我已经住在河内十多年了，我非常喜欢这里的天气。"},{"vi":"Giới thiệu với các bạn 1 chút đây là bạn thân của tôi anh ấy là 1 giáo viên.","zh":"我给你们介绍一下，这是我的好朋友，他是老师。"},{"vi":"Xin hỏi bạn có thể giúp tôi một chút không?","zh":"请问，你可以帮我一下吗？"},{"vi":"Tuần sau bắt đầu đi học rồi, hôm nay tôi phải đi mua quần áo mới.","zh":"下个星期开始上课了，我今天要去买新的衣服。"},{"vi":"Ăn cơm xong không được xem điện thoại nha.","zh":"吃饭的时候不要看手机好吗？"},{"vi":"Sau năm 18 tuổi, tôi một mình đến TP. HCM.","zh":"18 岁的时候我一个人来胡志明市。"},{"vi":"Cái máy tính này là mẹ mua cho tôi.","zh":"这台电脑是妈妈给我买的。"},{"vi":"Tôi không biết, không phải tôi nói.","zh":"我不知道，不是我说的。"},{"vi":"Tôi đã nhìn thấy con mèo của bạn, mắt to rất dễ thương.","zh":"我已经看见了你的猫，很可爱，眼睛大大的。"}]},{"lesson":5,"title":"就买这件吧 (Mua chiếc này đi)","vocab":[{"hanzi":"外面","pinyin":"wàimiàn","vi":"bên ngoài","example":{"hanzi":"我不想去外面吃。","pinyin":"Wǒ bù xiǎng qù wàimiàn chī.","vi":"Tôi không muốn ra ngoài ăn."}},{"hanzi":"准备","pinyin":"zhǔnbèi","vi":"định, chuẩn bị","example":{"hanzi":"你准备做什么呢？","pinyin":"Nǐ zhǔnbèi zuò shénme ne?","vi":"Bạn định làm món gì?"}},{"hanzi":"就","pinyin":"jiù","vi":"thì, ngay, liền","example":{"hanzi":"就买这件吧。","pinyin":"Jiù mǎi zhè jiàn ba.","vi":"Mua chiếc này luôn đi."}},{"hanzi":"鱼","pinyin":"yú","vi":"cá","example":{"hanzi":"就做你爱吃的鱼吧。","pinyin":"Jiù zuò nǐ ài chī de yú ba.","vi":"Thì nấu món cá mà bạn thích ăn nhé."}},{"hanzi":"吧","pinyin":"ba","vi":"đi, nhé (trợ từ)","example":{"hanzi":"我们去吃饭吧。","pinyin":"Wǒmen qù chī fàn ba.","vi":"Chúng ta đi ăn đi."}},{"hanzi":"件","pinyin":"jiàn","vi":"chiếc, cái (lượng từ quần áo)","example":{"hanzi":"这件衣服怎么样？","pinyin":"Zhè jiàn yīfu zěnmeyàng?","vi":"Chiếc áo này thế nào?"}},{"hanzi":"还","pinyin":"hái","vi":"còn, khá","example":{"hanzi":"颜色还可以。","pinyin":"Yánsè hái kěyǐ.","vi":"Màu sắc cũng tạm được."}},{"hanzi":"可以","pinyin":"kěyǐ","vi":"được, có thể","example":{"hanzi":"这件还可以。","pinyin":"Zhè jiàn hái kěyǐ.","vi":"Chiếc này cũng tạm ổn."}},{"hanzi":"不错","pinyin":"búcuò","vi":"không tồi, tốt","example":{"hanzi":"这件不错。","pinyin":"Zhè jiàn búcuò.","vi":"Chiếc này tốt đấy."}},{"hanzi":"考试","pinyin":"kǎoshì","vi":"thi, bài kiểm tra","example":{"hanzi":"是在想昨天的考试吗？","pinyin":"Shì zài xiǎng zuótiān de kǎoshì ma?","vi":"Đang nghĩ đến bài thi hôm qua à?"}},{"hanzi":"咖啡","pinyin":"kāfēi","vi":"cà phê","example":{"hanzi":"喝咖啡吗？","pinyin":"Hē kāfēi ma?","vi":"Uống cà phê không?"}},{"hanzi":"对","pinyin":"duì","vi":"đối với","example":{"hanzi":"喝多了对身体不好。","pinyin":"Hē duō le duì shēntǐ bù hǎo.","vi":"Uống nhiều không tốt cho sức khỏe."}},{"hanzi":"以后","pinyin":"yǐhòu","vi":"sau này, về sau","example":{"hanzi":"以后我少喝一点儿。","pinyin":"Yǐhòu wǒ shǎo hē yìdiǎnr.","vi":"Sau này tôi sẽ uống ít lại một chút."}}]},{"lesson":6,"title":"你怎么不吃了 (Sao anh không ăn nữa?)","vocab":[{"hanzi":"门","pinyin":"mén","vi":"cửa, cổng","example":{"hanzi":"我在门外看见他了。","pinyin":"Wǒ zài mén wài kànjiàn tā le.","vi":"Tôi nhìn thấy anh ấy ở ngoài cửa."}},{"hanzi":"外","pinyin":"wài","vi":"bên ngoài","example":{"hanzi":"门外有自行车。","pinyin":"Mén wài yǒu zìxíngchē.","vi":"Bên ngoài cửa có xe đạp."}},{"hanzi":"自行车","pinyin":"zìxíngchē","vi":"xe đạp","example":{"hanzi":"那是我的自行车。","pinyin":"Nà shì wǒ de zìxíngchē.","vi":"Đó là xe đạp của tôi."}},{"hanzi":"羊肉","pinyin":"yángròu","vi":"thịt dê, thịt cừu","example":{"hanzi":"今天的羊肉很好吃。","pinyin":"Jīntiān de yángròu hěn hǎochī.","vi":"Món thịt cừu hôm nay rất ngon."}},{"hanzi":"好吃","pinyin":"hǎochī","vi":"ngon","example":{"hanzi":"这个菜很好吃。","pinyin":"Zhège cài hěn hǎochī.","vi":"Món này rất ngon."}},{"hanzi":"面条","pinyin":"miàntiáo","vi":"mì sợi","example":{"hanzi":"来一点儿面条吧。","pinyin":"Lái yìdiǎnr miàntiáo ba.","vi":"Cho một ít mì sợi đi."}},{"hanzi":"打篮球","pinyin":"dǎ lánqiú","vi":"chơi bóng rổ","example":{"hanzi":"你们怎么没去打篮球？","pinyin":"Nǐmen zěnme méi qù dǎ lánqiú?","vi":"Sao các bạn không đi chơi bóng rổ?"}},{"hanzi":"因为","pinyin":"yīnwèi","vi":"bởi vì","example":{"hanzi":"因为昨天下雨。","pinyin":"Yīnwèi zuótiān xià yǔ.","vi":"Bởi vì hôm qua trời mưa."}},{"hanzi":"所以","pinyin":"suǒyǐ","vi":"cho nên","example":{"hanzi":"所以我们都没去。","pinyin":"Suǒyǐ wǒmen dōu méi qù.","vi":"Cho nên chúng tôi đều không đi."}},{"hanzi":"游泳","pinyin":"yóu yǒng","vi":"bơi lội","example":{"hanzi":"我去游泳了。","pinyin":"Wǒ qù yóu yǒng le.","vi":"Tôi đi bơi rồi."}},{"hanzi":"经常","pinyin":"jīngcháng","vi":"thường xuyên","example":{"hanzi":"你经常游泳吗？","pinyin":"Nǐ jīngcháng yóu yǒng ma?","vi":"Bạn có thường xuyên bơi không?"}},{"hanzi":"公斤","pinyin":"gōngjīn","vi":"kilôgam","example":{"hanzi":"我现在七十公斤了。","pinyin":"Wǒ xiànzài qīshí gōngjīn le.","vi":"Tôi bây giờ 70 kg rồi."}},{"hanzi":"姐姐","pinyin":"jiějie","vi":"chị gái","example":{"hanzi":"他是去看他姐姐。","pinyin":"Tā shì qù kàn tā jiějie.","vi":"Anh ấy đi thăm chị gái."}},{"hanzi":"河内烤肉米粉","pinyin":"Hénèi kǎoròu mǐfěn","vi":"bún chả Hà Nội"},{"hanzi":"顺滑牛肉米线","pinyin":"Shùnhuá niúròu mǐxiàn","vi":"bún bò Huế"},{"hanzi":"健身房","pinyin":"jiànshēnfáng","vi":"phòng gym"},{"hanzi":"随便","pinyin":"suíbiàn","vi":"tùy ý"}],"translations":[{"vi":"Vì hôm nay thời tiết rất đẹp nên tôi muốn ra ngoài đạp xe, bạn muốn đi cùng không? 2h chiều bắt đầu đi nhé.","zh":"因为今天天气真好，所以我想出去骑自行车。你想跟我一起去吗？下午两点开始去吧。"},{"vi":"Chị gái tôi thường ăn mì vào buổi sáng, tôi lại thích ăn phở và uống cà phê.","zh":"我姐姐早上经常吃面条。但是我喜欢吃河粉和喝咖啡。"},{"vi":"Bạn có thích ăn thịt cừu không? Tôi thấy nó hơi hôi nên rất ít ăn.","zh":"你喜欢吃羊肉吗？我觉得羊肉有点膻味，所以很少吃。"},{"vi":"Vì bên ngoài rất nóng nên chúng tôi đi bơi. Từ nhà tôi tới hồ bơi rất gần.","zh":"因为外面太热了，所以我们去游泳。 从我家到游泳池很近。"},{"vi":"Hôm qua tôi đã mua hai ki-lô thịt gà, hôm nay tôi sẽ nấu ăn.","zh":"昨天我买了两公斤的鸡肉，今天我打算做饭。"},{"vi":"Ngoài cửa có một chiếc xe đạp màu đỏ. Không biết là xe của ai.","zh":"在门外有一辆红色的自行车。我不知道是谁的。"},{"vi":"Vì chị gái tôi không biết bơi nên chị ấy không đi bơi cùng chúng tôi.","zh":"因为我姐姐不会游泳，所以她没跟我们去游泳。"},{"vi":"Vì mì ở nhà hàng này rất ngon nên tôi thường đến đây ăn.","zh":"因为这家饭店的面条很好吃，所以我经常来这里吃。"},{"vi":"Cuối tuần tôi thường chơi bóng rổ với chị gái ở công viên nên bây giờ tôi đã giảm được hai ki-lô.","zh":"周末我常常跟姐姐在公园打篮球，所以现在我瘦了两公斤。"},{"vi":"Anh ấy thường chơi bóng rổ ba lần mỗi tuần.","zh":"他经常每星期打三次篮球。"}]},{"lesson":7,"title":"你家离公司远吗 (Nhà chị có ở xa công ty không?)","vocab":[{"hanzi":"教室","pinyin":"jiàoshì","vi":"lớp học","example":{"hanzi":"他还在教室学习呢。","pinyin":"Tā hái zài jiàoshì xuéxí ne.","vi":"Anh ấy vẫn đang học trong lớp."}},{"hanzi":"机场","pinyin":"jīchǎng","vi":"sân bay","example":{"hanzi":"在去机场的路上。","pinyin":"Zài qù jīchǎng de lùshang.","vi":"Đang trên đường ra sân bay."}},{"hanzi":"路","pinyin":"lù","vi":"đường","example":{"hanzi":"路上车太多了！","pinyin":"Lùshang chē tài duō le!","vi":"Trên đường nhiều xe quá!"}},{"hanzi":"离","pinyin":"lí","vi":"cách (khoảng cách)","example":{"hanzi":"你家离公司远吗？","pinyin":"Nǐ jiā lí gōngsī yuǎn ma?","vi":"Nhà bạn cách công ty có xa không?"}},{"hanzi":"公司","pinyin":"gōngsī","vi":"công ty","example":{"hanzi":"我去公司上班。","pinyin":"Wǒ qù gōngsī shàng bān.","vi":"Tôi đi làm ở công ty."}},{"hanzi":"远","pinyin":"yuǎn","vi":"xa","example":{"hanzi":"我家离公司很远。","pinyin":"Wǒ jiā lí gōngsī hěn yuǎn.","vi":"Nhà tôi cách công ty rất xa."}},{"hanzi":"公共汽车","pinyin":"gōnggòng qìchē","vi":"xe buýt","example":{"hanzi":"坐公共汽车要一个多小时。","pinyin":"Zuò gōnggòng qìchē yào yí ge duō xiǎoshí.","vi":"Đi xe buýt mất hơn 1 tiếng."}},{"hanzi":"小时","pinyin":"xiǎoshí","vi":"tiếng, giờ đồng hồ","example":{"hanzi":"二十分钟就是一个小时的三分之一。","pinyin":"Èrshí fēnzhōng jiù shì yí ge xiǎoshí de sān fēn zhī yī.","vi":"20 phút là một phần ba giờ."}},{"hanzi":"慢","pinyin":"màn","vi":"chậm","example":{"hanzi":"坐汽车太慢了。","pinyin":"Zuò qìchē tài màn le.","vi":"Đi xe chậm quá."}},{"hanzi":"快","pinyin":"kuài","vi":"nhanh","example":{"hanzi":"开车也不快。","pinyin":"Kāi chē yě bú kuài.","vi":"Lái xe cũng không nhanh."}},{"hanzi":"过","pinyin":"guò","vi":"đón, qua (sinh nhật, lễ tết)","example":{"hanzi":"今天晚上给你过生日。","pinyin":"Jīntiān wǎnshang gěi nǐ guò shēngrì.","vi":"Tối nay tổ chức sinh nhật cho bạn nhé."}},{"hanzi":"走","pinyin":"zǒu","vi":"đi bộ","example":{"hanzi":"走几分钟就到了。","pinyin":"Zǒu jǐ fēnzhōng jiù dào le.","vi":"Đi bộ vài phút là đến."}},{"hanzi":"到","pinyin":"dào","vi":"đến","example":{"hanzi":"你已经到了吗？","pinyin":"Nǐ yǐjīng dào le ma?","vi":"Bạn đã đến chưa?"}},{"hanzi":"固定","pinyin":"gùdìng","vi":"cố định"},{"hanzi":"外国公司","pinyin":"wàiguó gōngsī","vi":"công ty nước ngoài"},{"hanzi":"赚钱","pinyin":"zhuàn qián","vi":"kiếm tiền"},{"hanzi":"视频制作人","pinyin":"shìpín zhìzuòrén","vi":"producer/người sản xuất video"},{"hanzi":"自由职业者","pinyin":"zìyóu zhíyèzhě","vi":"freelancer/người làm tự do"},{"hanzi":"会议","pinyin":"huìyì","vi":"cuộc họp"},{"hanzi":"堵车","pinyin":"dǔchē","vi":"tắc đường"},{"hanzi":"空气","pinyin":"kōngqì","vi":"không khí"},{"hanzi":"凉爽","pinyin":"liángshuǎng","vi":"mát mẻ"}],"translations":[{"vi":"Xin chào. Tôi tên là Gia Khang. Hiện tôi đang sống 1 mình ở Quận 10, Tp. HCM.","zh":"你好！我叫嘉康。今年我三十岁了。 现在我住在胡志明市第十郡。"},{"vi":"Tôi là freelancer và công việc của tôi là Producer.","zh":"我的工作是视频制作人和 我也是自由职业者。"},{"vi":"Hôm nay tôi có một cuộc họp với đồng nghiệp ở quán cà phê lúc 3h chiều. Cuộc họp kéo dài khoảng 2 tiếng.","zh":"今天下午三点我跟同事在咖啡店有会议. 会议持续了大概两个小时。"},{"vi":"Từ nhà tôi đến quán cà phê thì không xa lắm.","zh":"从我家到咖啡店不太远。"},{"vi":"Nhưng tắc đường. Nên tôi đi xe taxi 20p mới đến.","zh":"我平时开车10分钟就到了，但是今天堵车很严重，所以我坐出租车20分钟才到。"},{"vi":"Sau khi họp xong, tôi đi bơi ở phòng gym. Tối nay trời có mưa nhỏ nên không khí khá mát mẻ dễ chịu.","zh":"开完会后，我跟朋友一起去健身房游泳。 今晚下毛毛雨，所以空气很凉爽。"},{"vi":"8h tối, tôi về nhà, gọi đồ ăn tối và ăn một mình. Sau đó tôi xem tivi một chút rồi đi ngủ.","zh":"晚上8点，我回家，点外卖, 一个人吃晚饭。然后我看一会儿我喜欢的电影，就睡觉。"},{"vi":"Đây là 1 ngày thứ hai của tôi.","zh":"这就是我的星期日 (hoặc 星期一)。"}]},{"lesson":8,"title":"让我想想再告诉你 (Để mình suy nghĩ rồi sẽ nói cho bạn biết)","vocab":[{"hanzi":"再","pinyin":"zài","vi":"lại, hẵng, rồi mới","example":{"hanzi":"明天下午再去吧。","pinyin":"Míngtiān xiàwǔ zài qù ba.","vi":"Chiều mai hẵng đi nhé."}},{"hanzi":"让","pinyin":"ràng","vi":"bảo, để, cho","example":{"hanzi":"让我想想再告诉你。","pinyin":"Ràng wǒ xiǎngxiang zài gàosu nǐ.","vi":"Để tôi nghĩ một chút rồi nói cho bạn."}},{"hanzi":"告诉","pinyin":"gàosu","vi":"nói cho biết","example":{"hanzi":"明天告诉你。","pinyin":"Míngtiān gàosu nǐ.","vi":"Ngày mai nói cho bạn biết."}},{"hanzi":"等","pinyin":"děng","vi":"đợi, chờ","example":{"hanzi":"你等等我，好吗？","pinyin":"Nǐ děngdeng wǒ, hǎo ma?","vi":"Bạn đợi tôi một chút được không?"}},{"hanzi":"找","pinyin":"zhǎo","vi":"tìm","example":{"hanzi":"找大卫有什么事情吗？","pinyin":"Zhǎo Dàwèi yǒu shénme shìqing ma?","vi":"Tìm David có chuyện gì không?"}},{"hanzi":"事情","pinyin":"shìqing","vi":"sự việc, chuyện","example":{"hanzi":"没有什么事情。","pinyin":"Méiyǒu shénme shìqing.","vi":"Không có chuyện gì."}},{"hanzi":"服务员","pinyin":"fúwùyuán","vi":"nhân viên phục vụ","example":{"hanzi":"服务员，门打不开了。","pinyin":"Fúwùyuán, mén dǎ bù kāi le.","vi":"Phục vụ ơi, cửa không mở được."}},{"hanzi":"白","pinyin":"bái","vi":"màu trắng","example":{"hanzi":"这件白的有点儿长。","pinyin":"Zhè jiàn bái de yǒudiǎnr cháng.","vi":"Cái màu trắng này hơi dài."}},{"hanzi":"黑","pinyin":"hēi","vi":"màu đen","example":{"hanzi":"那件黑的有点儿贵。","pinyin":"Nà jiàn hēi de yǒudiǎnr guì.","vi":"Cái màu đen kia hơi đắt."}},{"hanzi":"贵","pinyin":"guì","vi":"đắt, mắc","example":{"hanzi":"这件衣服太贵了。","pinyin":"Zhè jiàn yīfu tài guì le.","vi":"Cái áo này đắt quá."}},{"hanzi":"放暑假","pinyin":"fàng shǔjià","vi":"nghỉ hè"},{"hanzi":"春节","pinyin":"chūnjié","vi":"lễ Tết"},{"hanzi":"中秋节","pinyin":"zhōngqiūjié","vi":"Tết trung thu"},{"hanzi":"可爱","pinyin":"kě'ài","vi":"dễ thương"}],"translations":[{"vi":"Vì chiều nay tôi có việc nên không thể đi xem phim với bạn, để ngày mai chúng ta đi nhé.","zh":"因为今天下午我有点事，所以不能跟你去看电影，我们明天再去吧。"},{"vi":"Tôi nghe nói bạn tìm tôi có chuyện gì quan trọng vậy? Nói cho tôi biết đi.","zh":"我听说你找我，有什么重的事吗？告诉我吧。"},{"vi":"Nhân viên phục vụ nói sẽ lên món, bảo tôi đợi trong phòng một lát.","zh":"服务员说会上菜，让我在房间里等一会儿。"},{"vi":"Chiếc đồng hồ màu đen này tôi rất thích nhưng nó rất đắt, đợi tới sinh nhật của tôi bạn tặng tôi nhé.","zh":"这块黑色的手表我很喜欢，但是很贵。等到我生日你送给我吧。"},{"vi":"Bạn đợi ở đây bao lâu rồi? Tại sao không gọi cho tôi, bây giờ chúng ta đi nhé.","zh":"你在这里等我多久了？为什么没给我打电话？我们现在去吧。"},{"vi":"Trời tối rồi ngày mai chúng ta hẵng đi nhé, bây giờ hãy ở nhà ăn tối đã.","zh":"现在很晚了，明天我们再去吧。现在再在家吃晚饭吧。"},{"vi":"Để tôi xem thử, chiếc máy tính màu trắng này không phải là của tôi.","zh":"让我看看。这台白色的电脑不是我的。"},{"vi":"Cám ơn quý khách hôm nay đã tới tiệm của chúng tôi mua đồ.","zh":"谢谢您今天来我们商店买东西。"}]},{"lesson":9,"title":"题太多, 我没做完 (Câu hỏi quá nhiều nên mình không làm hết)","vocab":[{"hanzi":"错","pinyin":"cuò","vi":"sai, nhầm","example":{"hanzi":"你打错了。","pinyin":"Nǐ dǎ cuò le.","vi":"Bạn gọi nhầm số rồi."}},{"hanzi":"从","pinyin":"cóng","vi":"từ","example":{"hanzi":"您从几岁开始学习？","pinyin":"Nín cóng jǐ suì kāishǐ xuéxí?","vi":"Cô bắt đầu học từ mấy tuổi?"}},{"hanzi":"跳舞","pinyin":"tiào wǔ","vi":"múa, khiêu vũ","example":{"hanzi":"我喜欢跳舞。","pinyin":"Wǒ xǐhuan tiào wǔ.","vi":"Tôi thích múa."}},{"hanzi":"第一","pinyin":"dì yī","vi":"thứ nhất, đầu tiên","example":{"hanzi":"我第一次跳舞是七岁。","pinyin":"Wǒ dì yī cì tiào wǔ shì qī suì.","vi":"Lần đầu tôi múa là lúc bảy tuổi."}},{"hanzi":"希望","pinyin":"xīwàng","vi":"hy vọng","example":{"hanzi":"希望他能喜欢。","pinyin":"Xīwàng tā néng xǐhuan.","vi":"Hy vọng anh ấy sẽ thích."}},{"hanzi":"问题","pinyin":"wèntí","vi":"vấn đề, câu hỏi","example":{"hanzi":"没问题，非常欢迎。","pinyin":"Méi wèntí, fēicháng huānyíng.","vi":"Không vấn đề gì, rất hoan nghênh."}},{"hanzi":"欢迎","pinyin":"huānyíng","vi":"hoan nghênh","example":{"hanzi":"欢迎你来中国。","pinyin":"Huānyíng nǐ lái Zhōngguó.","vi":"Hoan nghênh bạn đến Trung Quốc."}},{"hanzi":"上班","pinyin":"shàng bān","vi":"đi làm","example":{"hanzi":"他从什么时候开始上班？","pinyin":"Tā cóng shénme shíhou kāishǐ shàng bān?","vi":"Anh ấy bắt đầu đi làm từ khi nào?"}},{"hanzi":"懂","pinyin":"dǒng","vi":"hiểu","example":{"hanzi":"你都听懂了吗？","pinyin":"Nǐ dōu tīng dǒng le ma?","vi":"Bạn đã nghe hiểu hết chưa?"}},{"hanzi":"完","pinyin":"wán","vi":"xong, hết","example":{"hanzi":"你都做完了没有？","pinyin":"Nǐ dōu zuò wán le méiyǒu?","vi":"Bạn đã làm xong hết chưa?"}},{"hanzi":"题","pinyin":"tí","vi":"câu hỏi, đề","example":{"hanzi":"题太多, 我没做完。","pinyin":"Tí tài duō, wǒ méi zuò wán.","vi":"Câu hỏi quá nhiều, tôi chưa làm xong."}},{"hanzi":"记得","pinyin":"jìde","vi":"nhớ"},{"hanzi":"离开","pinyin":"líkāi","vi":"rời khỏi"},{"hanzi":"感觉","pinyin":"gǎnjué","vi":"cảm giác"},{"hanzi":"春夏秋冬","pinyin":"chūn xià qiū dōng","vi":"xuân hạ thu đông"},{"hanzi":"孝顺","pinyin":"xiàoshùn","vi":"hiếu thảo"}],"translations":[{"vi":"Từ khi đi làm, tôi không còn có thời gian học nhảy nữa.","zh":"从上班开始，我没有时间学跳舞了。"},{"vi":"Đây là lần đầu tiên tôi làm sai nhiều câu hỏi như vậy.","zh":"这是我第一次做错这么多题。"},{"vi":"Nếu bạn không hiểu câu hỏi thì có thể hỏi giáo viên.","zh":"如果你不懂问题，你可以问老师。"},{"vi":"Anh ấy nói rất nhanh nên tôi không hiểu.","zh":"他说得太快了，所以我听不懂。"},{"vi":"Từ nhỏ đến lớn, tôi luôn thích đi du lịch đến những nơi mới.","zh":"从小到大，我总是喜欢去新的地方旅游。"},{"vi":"Chúng tôi rất hoan nghênh bạn đến công ty làm việc.","zh":"我们非常欢迎您来我们公司工作。"},{"vi":"Mẹ ơi con làm xong bài tập rồi, bây giờ con có thể đi công viên chơi không?","zh":"妈妈！我做完作业了，现在我可以去公园玩吗？"},{"vi":"Đây là lần đầu tiên tôi đến Mĩ, ở đây thật đẹp, đồ ăn không ngon lắm.","zh":"这是我第一次来美国。这里很漂亮，但是这儿的食物不太好吃。"}]},{"lesson":10,"title":"别找了，手机在桌子上呢 (Đừng tìm nữa, điện thoại ở trên bàn kìa)","vocab":[{"hanzi":"课","pinyin":"kè","vi":"giờ học, môn học","example":{"hanzi":"明天还有汉语课呢。","pinyin":"Míngtiān hái yǒu Hànyǔ kè ne.","vi":"Ngày mai còn có tiết tiếng Trung nữa."}},{"hanzi":"帮助","pinyin":"bāngzhù","vi":"giúp đỡ, sự giúp đỡ","example":{"hanzi":"看电视对学汉语有帮助。","pinyin":"Kàn diànshì duì xué Hànyǔ yǒu bāngzhù.","vi":"Xem tivi có ích cho việc học tiếng Trung."}},{"hanzi":"别","pinyin":"bié","vi":"đừng","example":{"hanzi":"别看报纸了。","pinyin":"Bié kàn bàozhǐ le.","vi":"Đừng đọc báo nữa."}},{"hanzi":"哥哥","pinyin":"gēge","vi":"anh trai","example":{"hanzi":"哥哥今天中午回来吃饭。","pinyin":"Gēge jīntiān zhōngwǔ huílai chī fàn.","vi":"Trưa nay anh trai về ăn cơm."}},{"hanzi":"鸡蛋","pinyin":"jīdàn","vi":"trứng gà","example":{"hanzi":"我买了一些鸡蛋。","pinyin":"Wǒ mǎi le yìxiē jīdàn.","vi":"Tôi đã mua một ít trứng gà."}},{"hanzi":"西瓜","pinyin":"xīguā","vi":"dưa hấu","example":{"hanzi":"你要吃西瓜吗？","pinyin":"Nǐ yào chī xīguā ma?","vi":"Bạn có muốn ăn dưa hấu không?"}},{"hanzi":"正在","pinyin":"zhèngzài","vi":"đang","example":{"hanzi":"正在准备午饭呢！","pinyin":"Zhèngzài zhǔnbèi wǔfàn ne!","vi":"Đang chuẩn bị bữa trưa!"}},{"hanzi":"手机","pinyin":"shǒujī","vi":"điện thoại di động","example":{"hanzi":"手机在桌子上呢。","pinyin":"Shǒujī zài zhuōzi shang ne.","vi":"Điện thoại nằm ở trên bàn kìa."}},{"hanzi":"洗","pinyin":"xǐ","vi":"giặt, rửa","example":{"hanzi":"衣服我帮你洗了。","pinyin":"Yīfu wǒ bāng nǐ xǐ le.","vi":"Tôi đã giặt quần áo giúp bạn rồi."}},{"hanzi":"品牌","pinyin":"pǐnpái","vi":"thương hiệu"},{"hanzi":"护肤品","pinyin":"hùfūpǐn","vi":"sản phẩm chăm sóc da"},{"hanzi":"日常品","pinyin":"rìchángpǐn","vi":"đồ dùng hàng ngày"},{"hanzi":"洗头","pinyin":"xǐ tóu","vi":"gội đầu"},{"hanzi":"洗澡","pinyin":"xǐ zǎo","vi":"tắm"},{"hanzi":"榴莲","pinyin":"liúlián","vi":"sầu riêng"},{"hanzi":"草莓","pinyin":"cǎoméi","vi":"dâu tây"},{"hanzi":"芒果","pinyin":"mángguǒ","vi":"xoài"},{"hanzi":"牛油果","pinyin":"niúyóuguǒ","vi":"bơ (trái cây)"},{"hanzi":"酸甜苦辣咸","pinyin":"suān tián kǔ là xián","vi":"chua ngọt đắng cay mặn"}],"translations":[{"vi":"Đừng xem tivi nữa, ngày mai bạn còn có tiết học tiếng Trung đấy.","zh":"别看电视了，明天你还有中文课啊。"},{"vi":"Anh trai tôi đang ở trong bếp chuẩn bị bữa trưa.","zh":"我哥哥正在厨房准备午饭。"},{"vi":"Đừng tìm điện thoại nữa, điện thoại của bạn ở trên bàn, bên cạnh máy tính kìa.","zh":"别找手机了，你的手机就在桌子上，电脑旁边呢。"},{"vi":"Xem phim Trung Quốc rất có ích cho việc học tiếng Trung, vì vậy tôi thường xem phim vào mỗi tối.","zh":"看中文电影对学习中文很有帮助，所以我每天晚上都看电影。"},{"vi":"Bạn mua nhiều đồ như vậy để làm gì? Tôi mua trứng gà, mì và một quả dưa hấu.","zh":"你为什么买这么多东西干什么？我买鸡蛋，面条和一个西瓜。"},{"vi":"Đừng uống cà phê nữa, bác sĩ nói uống quá nhiều cà phê không tốt cho sức khỏe.","zh":"别喝咖啡了。医生说喝太多咖啡对身体不好。"},{"vi":"Mẹ đang chuẩn bị bữa trưa đấy, bạn đừng chơi điện thoại nữa, mau đến giúp mẹ đi.","zh":"妈妈正在做午饭。你别玩手机了，快来帮妈妈吧。"},{"vi":"Anh trai tôi hôm nay về nhà ăn cơm, vì vậy mẹ đã mua rất nhiều đồ để chuẩn bị bữa trưa.","zh":"我哥哥今天回家吃饭，所以我妈妈买了很多东西准备午饭。"}]},{"lesson":11,"title":"他比我大三岁 (Anh ấy lớn hơn mình ba tuổi)","vocab":[{"hanzi":"唱歌","pinyin":"chàng gē","vi":"hát","example":{"hanzi":"昨天和你一起唱歌的人是谁？","pinyin":"Zuótiān hé nǐ yìqǐ chàng gē de rén shì shéi?","vi":"Người hát cùng bạn hôm qua là ai?"}},{"hanzi":"男","pinyin":"nán","vi":"nam","example":{"hanzi":"是不是男朋友？","pinyin":"Shì bu shì nánpéngyou?","vi":"Có phải là bạn trai không?"}},{"hanzi":"女","pinyin":"nǚ","vi":"nữ","example":{"hanzi":"看报纸的女孩子是你姐姐吗？","pinyin":"Kàn bàozhǐ de nǚ háizi shì nǐ jiějie ma?","vi":"Cô gái đang đọc báo là chị bạn à?"}},{"hanzi":"孩子","pinyin":"háizi","vi":"đứa trẻ","example":{"hanzi":"这个女孩子很漂亮。","pinyin":"Zhège nǚ háizi hěn piàoliang.","vi":"Cô bé này rất đẹp."}},{"hanzi":"右边","pinyin":"yòubian","vi":"bên phải","example":{"hanzi":"右边写字的人是我哥哥。","pinyin":"Yòubian xiě zì de rén shì wǒ gēge.","vi":"Người viết chữ ở bên phải là anh trai tôi."}},{"hanzi":"比","pinyin":"bǐ","vi":"hơn, so với","example":{"hanzi":"他比我大三岁。","pinyin":"Tā bǐ wǒ dà sān suì.","vi":"Anh ấy lớn hơn tôi ba tuổi."}},{"hanzi":"便宜","pinyin":"piányi","vi":"rẻ","example":{"hanzi":"西瓜比昨天便宜。","pinyin":"Xīguā bǐ zuótiān piányi.","vi":"Dưa hấu rẻ hơn hôm qua."}},{"hanzi":"说话","pinyin":"shuō huà","vi":"nói chuyện","example":{"hanzi":"前边说话的那个人就是我的老师。","pinyin":"Qiánbian shuō huà de nàge rén jiù shì wǒ de lǎoshī.","vi":"Người đang nói chuyện ở phía trước chính là giáo viên của tôi."}},{"hanzi":"可能","pinyin":"kěnéng","vi":"có thể, có lẽ","example":{"hanzi":"你可能不认识她。","pinyin":"Nǐ kěnéng bú rènshi tā.","vi":"Có lẽ bạn không biết cô ấy."}},{"hanzi":"去年","pinyin":"qùnián","vi":"năm ngoái","example":{"hanzi":"她是去年来的。","pinyin":"Tā shì qùnián lái de.","vi":"Cô ấy đến vào năm ngoái."}},{"hanzi":"姓","pinyin":"xìng","vi":"họ","example":{"hanzi":"她姓王。","pinyin":"Tā xìng Wáng.","vi":"Cô ấy họ Vương."}},{"hanzi":"比赛","pinyin":"bǐsài","vi":"thi đấu"},{"hanzi":"晕车","pinyin":"yùn chē","vi":"say xe"},{"hanzi":"继续","pinyin":"jìxù","vi":"tiếp tục"},{"hanzi":"专心","pinyin":"zhuānxīn","vi":"chuyên tâm"},{"hanzi":"兴奋","pinyin":"xīngfèn","vi":"phấn khích"},{"hanzi":"其实","pinyin":"qíshí","vi":"thực ra"},{"hanzi":"洗衣机","pinyin":"xǐyījī","vi":"máy giặt"},{"hanzi":"洗碗机","pinyin":"xǐwǎnjī","vi":"máy rửa bát"}],"translations":[{"vi":"Người mà bạn thường nói chuyện cùng là ai vậy?","zh":"常常跟你说话的那个人是谁？"},{"vi":"Táo mà tôi mua sáng nay rất ngọt và rẻ.","zh":"我今天早上买的苹果又甜又便宜。"},{"vi":"Người bạn đồng nghiệp tôi quen ở công ty hôm nay không đi làm.","zh":"我在公司认识的同事今天没上班。"},{"vi":"Cuốn sách mà bạn giới thiệu cho tôi tuần trước rất hay.","zh":"你上个星期给我介绍的那本书很有意思。"},{"vi":"Người mà bạn đang đợi là bạn của tôi.","zh":"你正在等的那个人是我的朋友。"},{"vi":"Anh trai của bạn cao hơn tôi rất nhiều.","zh":"你哥哥比我高多了。"},{"vi":"Thời tiết hôm nay nóng hơn hôm qua 1 chút.","zh":"今天天气比昨天热一些。"},{"vi":"Hôm nay không lạnh bằng hôm qua.","zh":"今天没有昨天那么冷。"},{"vi":"Bạn nhỏ hơn em gái của tôi 2 tuổi.","zh":"你比我妹妹小两岁。"}]},{"lesson":12,"title":"你穿得太少了 (Bạn mặc ít quá)","vocab":[{"hanzi":"得","pinyin":"de","vi":"trợ từ (chỉ mức độ, trạng thái)","example":{"hanzi":"你穿得太少了。","pinyin":"Nǐ chuān de tài shǎo le.","vi":"Bạn mặc ít quá."}},{"hanzi":"妻子","pinyin":"qīzi","vi":"vợ","example":{"hanzi":"我妻子生病了。","pinyin":"Wǒ qīzi shēng bìng le.","vi":"Vợ tôi bị ốm rồi."}},{"hanzi":"雪","pinyin":"xuě","vi":"tuyết","example":{"hanzi":"外面下大雪了。","pinyin":"Wàimiàn xià dà xuě le.","vi":"Bên ngoài tuyết rơi lớn rồi."}},{"hanzi":"零","pinyin":"líng","vi":"không (số 0)","example":{"hanzi":"今天是零下十度。","pinyin":"Jīntiān shì líng xià shí dù.","vi":"Hôm nay là âm 10 độ."}},{"hanzi":"度","pinyin":"dù","vi":"độ","example":{"hanzi":"今天二十度。","pinyin":"Jīntiān èrshí dù.","vi":"Hôm nay 20 độ."}},{"hanzi":"穿","pinyin":"chuān","vi":"mặc","example":{"hanzi":"多穿一点儿衣服。","pinyin":"Duō chuān yìdiǎnr yīfu.","vi":"Mặc nhiều áo ấm vào một chút."}},{"hanzi":"进","pinyin":"jìn","vi":"vào","example":{"hanzi":"快进房间吧。","pinyin":"Kuài jìn fángjiān ba.","vi":"Mau vào phòng đi."}},{"hanzi":"弟弟","pinyin":"dìdi","vi":"em trai","example":{"hanzi":"弟弟去学校了。","pinyin":"Dìdi qù xuéxiào le.","vi":"Em trai đi học rồi."}},{"hanzi":"近","pinyin":"jìn","vi":"gần","example":{"hanzi":"我家离学校很近。","pinyin":"Wǒ jiā lí xuéxiào hěn jìn.","vi":"Nhà tôi cách trường rất gần."}},{"hanzi":"认真","pinyin":"rènzhēn","vi":"chăm chỉ, nghiêm túc"},{"hanzi":"夫妻","pinyin":"fūqī","vi":"vợ chồng"},{"hanzi":"温度","pinyin":"wēndù","vi":"nhiệt độ"},{"hanzi":"闷热","pinyin":"mēnrè","vi":"nóng nực"},{"hanzi":"西服","pinyin":"xīfú","vi":"âu phục"},{"hanzi":"公里","pinyin":"gōnglǐ","vi":"ki-lô-mét"},{"hanzi":"重要","pinyin":"zhòngyào","vi":"quan trọng"},{"hanzi":"重视","pinyin":"zhòngshì","vi":"coi trọng"},{"hanzi":"稳定","pinyin":"wěndìng","vi":"ổn định"},{"hanzi":"自由","pinyin":"zìyóu","vi":"tự do"}],"translations":[{"vi":"Tôi cảm thấy anh ấy chăm sóc bố mẹ rất tốt.","zh":"我觉得他对父母照顾得很好。"},{"vi":"Tôi cảm thấy anh ấy làm việc rất chăm chỉ.","zh":"我觉得他工作得很认真。"},{"vi":"Hôm nay âm 10 độ, lại còn có tuyết.","zh":"今天零下十度，又下雪。"},{"vi":"Tôi cảm thấy việc ghi nhớ Hán tự là khó nhất.","zh":"我觉得记住汉字是最难。"}]},{"lesson":13,"title":"门开着呢 (Cửa đang mở)","vocab":[{"hanzi":"着","pinyin":"zhe","vi":"đang (trạng thái tiếp diễn)","example":{"hanzi":"门开着呢。","pinyin":"Mén kāi zhe ne.","vi":"Cửa đang mở đấy."}},{"hanzi":"手","pinyin":"shǒu","vi":"tay","example":{"hanzi":"手里拿着一支铅笔。","pinyin":"Shǒu lǐ ná zhe yì zhī qiānbǐ.","vi":"Trong tay đang cầm một cây bút chì."}},{"hanzi":"拿","pinyin":"ná","vi":"cầm, lấy","example":{"hanzi":"她手里拿着什么？","pinyin":"Tā shǒu lǐ ná zhe shénme?","vi":"Trong tay cô ấy đang cầm cái gì?"}},{"hanzi":"铅笔","pinyin":"qiānbǐ","vi":"bút chì","example":{"hanzi":"这是我的铅笔。","pinyin":"Zhè shì wǒ de qiānbǐ.","vi":"Đây là bút chì của tôi."}},{"hanzi":"班","pinyin":"bān","vi":"lớp","example":{"hanzi":"这是我们班。","pinyin":"Zhè shì wǒmen bān.","vi":"Đây là lớp chúng tôi."}},{"hanzi":"长","pinyin":"zhǎng","vi":"trưởng, lớn","example":{"hanzi":"他是我们的班长。","pinyin":"Tā shì wǒmen de bānzhǎng.","vi":"Anh ấy là lớp trưởng của chúng tôi."}},{"hanzi":"笑","pinyin":"xiào","vi":"cười","example":{"hanzi":"她笑着说。","pinyin":"Tā xiào zhe shuō.","vi":"Cô ấy cười và nói."}},{"hanzi":"宾馆","pinyin":"bīnguǎn","vi":"khách sạn","example":{"hanzi":"我们去宾馆。","pinyin":"Wǒmen qù bīnguǎn.","vi":"Chúng ta đi khách sạn."}},{"hanzi":"一直","pinyin":"yìzhí","vi":"thẳng, liên tục","example":{"hanzi":"一直往前走。","pinyin":"Yìzhí wǎng qián zǒu.","vi":"Cứ đi thẳng về phía trước."}},{"hanzi":"往","pinyin":"wǎng","vi":"hướng về","example":{"hanzi":"往左走。","pinyin":"Wǎng zuǒ zǒu.","vi":"Đi về bên trái."}},{"hanzi":"路口","pinyin":"lùkǒu","vi":"ngã tư, giao lộ","example":{"hanzi":"到了路口往右拐。","pinyin":"Dào le lùkǒu wǎng yòu guǎi.","vi":"Đến ngã tư rẽ phải."}},{"hanzi":"站","pinyin":"zhàn","vi":"đứng"},{"hanzi":"粗","pinyin":"cū","vi":"dày, thô ráp"},{"hanzi":"粗心","pinyin":"cū xīn","vi":"bất cẩn"},{"hanzi":"顺","pinyin":"shùn","vi":"thuận"},{"hanzi":"长大","pinyin":"zhǎng dà","vi":"lớn lên"},{"hanzi":"笑起来","pinyin":"xiào qǐ lái","vi":"cười phá lên"},{"hanzi":"订","pinyin":"dìng","vi":"đặt hàng"},{"hanzi":"订房","pinyin":"dìng fáng","vi":"đặt phòng"},{"hanzi":"预订","pinyin":"yù dìng","vi":"đặt chỗ"},{"hanzi":"圆珠笔","pinyin":"yuán zhū bǐ","vi":"bút bi"},{"hanzi":"左拐","pinyin":"zuǒ guǎi","vi":"rẽ trái"},{"hanzi":"右拐","pinyin":"yòu guǎi","vi":"rẽ phải"},{"hanzi":"导航","pinyin":"dǎo háng","vi":"điều hướng"},{"hanzi":"迷路","pinyin":"mí lù","vi":"bị lạc"},{"hanzi":"迷上","pinyin":"mí shàng","vi":"bị ám ảnh bởi"},{"hanzi":"追剧","pinyin":"zhuī jù","vi":"theo dõi các bộ phim truyền hình"},{"hanzi":"短剧","pinyin":"duǎn jù","vi":"vở kịch, phim ngắn"},{"hanzi":"好奇","pinyin":"hào qí","vi":"tò mò"}],"translations":[{"vi":"Người đang mặc bộ đồ màu đỏ đó là ai vậy? Là anh trai của bạn tôi, anh ấy rất đẹp trai phải không? Vẫn chưa có bạn gái đâu.","zh":"正在穿红色衣服的那个人是谁？是我朋友的哥哥。 他很帅，不是吗？他还是没有女朋友。"},{"vi":"Tay bạn thật đẹp, nhưng mà có rất nhiều lông.","zh":"你的手真漂亮， 但是毛有点多。"},{"vi":"Hôm nay mấy giờ bạn làm việc? Mua cho tôi 1 cây bút chì nhé.","zh":"你今天几点上班？ 给我买一支铅笔吧。"},{"vi":"Tôi đang ở giao lộ đợi bạn, nhìn về phía trước đi tôi nhìn thấy bạn rồi.","zh":"我在路口等你，一直往前看吧， 我看见你了。"},{"vi":"Thật là mắc cười, bạn đi du lịch mà không biết ở khách sạn nào hả.","zh":"真好笑，你去旅游但是不知道在哪家宾馆吗？"}]},{"lesson":14,"title":"你看过那个电影吗 (Bạn đã xem bộ phim đó chưa?)","vocab":[{"hanzi":"意思","pinyin":"yìsi","vi":"ý nghĩa, thú vị","example":{"hanzi":"这个电影很有意思。","pinyin":"Zhège diànyǐng hěn yǒu yìsi.","vi":"Bộ phim này rất thú vị."}},{"hanzi":"但是","pinyin":"dànshì","vi":"nhưng","example":{"hanzi":"虽然有点儿贵，但是很好。","pinyin":"Suīrán yǒudiǎnr guì, dànshì hěn hǎo.","vi":"Tuy hơi đắt một chút nhưng rất tốt."}},{"hanzi":"虽然","pinyin":"suīrán","vi":"mặc dù","example":{"hanzi":"虽然下雨，他还是去了。","pinyin":"Suīrán xià yǔ, tā háishì qù le.","vi":"Mặc dù trời mưa, anh ấy vẫn đi."}},{"hanzi":"次","pinyin":"cì","vi":"lần","example":{"hanzi":"我去过一次北京。","pinyin":"Wǒ qù guò yí cì Běijīng.","vi":"Tôi đã đi Bắc Kinh một lần."}},{"hanzi":"玩儿","pinyin":"wánr","vi":"chơi","example":{"hanzi":"昨天你去哪儿玩儿了？","pinyin":"Zuótiān nǐ qù nǎr wánr le?","vi":"Hôm qua bạn đi đâu chơi vậy?"}},{"hanzi":"晴","pinyin":"qíng","vi":"trời quang, nắng","example":{"hanzi":"明天是晴天。","pinyin":"Míngtiān shì qíng tiān.","vi":"Ngày mai là ngày nắng."}},{"hanzi":"百","pinyin":"bǎi","vi":"trăm","example":{"hanzi":"这个东西一百块。","pinyin":"Zhège dōngxi yì bǎi kuài.","vi":"Món đồ này một trăm đồng."}},{"hanzi":"出差","pinyin":"chū chāi","vi":"công tác"},{"hanzi":"部","pinyin":"bù","vi":"phòng，bộ (phim)"},{"hanzi":"没意思","pinyin":"méi yì si","vi":"không thú vị, nhàm chán"},{"hanzi":"懂事","pinyin":"dǒng shì","vi":"hợp lý, hiểu chuyện"},{"hanzi":"过分","pinyin":"guò fèn","vi":"quá mức, quá đáng"},{"hanzi":"为了","pinyin":"wèi le","vi":"vì"},{"hanzi":"遍","pinyin":"biàn","vi":"lần (times)"},{"hanzi":"小孩","pinyin":"xiǎo hái","vi":"đứa trẻ"},{"hanzi":"开心","pinyin":"kāi xīn","vi":"vui mừng"},{"hanzi":"阴天","pinyin":"yīn tiān","vi":"trời râm mát"},{"hanzi":"多云","pinyin":"duō yún","vi":"có mây, sắp mưa"},{"hanzi":"无聊","pinyin":"wú liáo","vi":"nhạt nhẽo, nhàm chán"},{"hanzi":"健身房","pinyin":"jiàn shēn fáng","vi":"phòng gym"},{"hanzi":"玩耍","pinyin":"wán shuǎ","vi":"chơi đùa"},{"hanzi":"越南盾","pinyin":"yuè nán dùn","vi":"đồng việt nam"},{"hanzi":"到时候","pinyin":"dào shí hòu","vi":"đến lúc đó"},{"hanzi":"还可以","pinyin":"hái kě yǐ","vi":"cũng được"},{"hanzi":"德国","pinyin":"dé guó","vi":"nước đức"},{"hanzi":"电影院","pinyin":"diàn yǐng yuàn","vi":"rạp chiếu phim"}],"translations":[{"vi":"Xin hãy nói lại 1 lần nữa","zh":"请你再说一遍"}]},{"lesson":15,"title":"新年就要到了 (Năm mới sắp đến rồi)","vocab":[{"hanzi":"日","pinyin":"rì","vi":"ngày","example":{"hanzi":"今天是十月一日。","pinyin":"Jīntiān shì shí yuè yí rì.","vi":"Hôm hôm nay là mùng 1 tháng 10."}},{"hanzi":"新年","pinyin":"xīnnián","vi":"năm mới","example":{"hanzi":"新年就要到了。","pinyin":"Xīnnián jiù yào dào le.","vi":"Năm mới sắp đến rồi."}},{"hanzi":"票","pinyin":"piào","vi":"vé","example":{"hanzi":"你买到票了吗？","pinyin":"Nǐ mǎi dào piào le ma?","vi":"Bạn đã mua được vé chưa?"}},{"hanzi":"火车站","pinyin":"huǒchēzhàn","vi":"ga xe lửa","example":{"hanzi":"去火车站买票。","pinyin":"Qù huǒchēzhàn mǎi piào.","vi":"Đi ga xe lửa mua vé."}},{"hanzi":"大家","pinyin":"dàjiā","vi":"mọi người","example":{"hanzi":"大家都来了。","pinyin":"Dàjiā dōu lái le.","vi":"Mọi người đều đến rồi."}},{"hanzi":"更","pinyin":"gèng","vi":"hơn, càng","example":{"hanzi":"这样更好。","pinyin":"Zhè yàng gèng hǎo.","vi":"Như vậy càng tốt."}},{"hanzi":"妹妹","pinyin":"mèimei","vi":"em gái","example":{"hanzi":"我妹妹喜欢唱歌。","pinyin":"Wǒ mèimei xǐhuan chàng gē.","vi":"Em gái tôi thích hát."}},{"hanzi":"阴","pinyin":"yīn","vi":"râm, âm u (thời tiết)","example":{"hanzi":"今天是阴天。","pinyin":"Jīntiān shì yīn tiān.","vi":"Hôm nay trời âm u."}}]}];
        
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9iif4euYM4QEdIDbsTfN_84SVfFrFAgMGb_32ZQXkZHTKzw1DO8W999jN8PpfJ0ts/exec'; 
        
        let appData = INITIAL_DATA;
        const app = document.getElementById('app');
        const navList = document.getElementById('nav-list');

        async function loadFromCloud() {
            if (SCRIPT_URL === 'YOUR_GOOGLE_SHEETS_WEB_APP_URL_HERE') {
                let localData = JSON.parse(localStorage.getItem('hsk2Data_v18'));
                if (localData) appData = localData;
                renderApp();
            } else {
                try {
                    app.innerHTML = '<div style="text-align:center; padding: 40px;"><p style="font-size: 1.2rem; color: #2980b9;">⏳ Đang đồng bộ dữ liệu từ đám mây...</p></div>';
                    const res = await fetch(SCRIPT_URL);
                    const cloudData = await res.json();
                    
                    if (cloudData && cloudData.length > 0) {
                        appData = cloudData;
                    }
                } catch(e) {
                    console.error("Lỗi tải từ Google Sheets:", e);
                    let localData = JSON.parse(localStorage.getItem('hsk2Data_v18'));
                    if (localData) appData = localData;
                }
                renderApp();
            }
        }

        function saveToCloud() {
            localStorage.setItem('hsk2Data_v18', JSON.stringify(appData));
            
            if (SCRIPT_URL !== 'YOUR_GOOGLE_SHEETS_WEB_APP_URL_HERE') {
                try {
                    const formData = new URLSearchParams();
                    formData.append('data', JSON.stringify(appData));
                    fetch(SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' });
                } catch(e) {
                    console.error("Lỗi lưu lên cloud:", e);
                }
            }
        }

        function renderApp() {
            app.innerHTML = '';
            navList.innerHTML = '';
            
            const selectVocab = document.getElementById('vocab-lesson');
            const selectTrans = document.getElementById('trans-lesson');
            
            const currentVocabLesson = selectVocab.value;
            const currentTransLesson = selectTrans.value;
            
            selectVocab.innerHTML = '';
            selectTrans.innerHTML = '';

            appData.forEach(lesson => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#lesson-${lesson.lesson}`;
                a.textContent = `Bài ${lesson.lesson}`;
                li.appendChild(a);
                navList.appendChild(li);
                
                const optionHtml = `<option value="${lesson.lesson}">Bài ${lesson.lesson}: ${lesson.title}</option>`;
                selectVocab.innerHTML += optionHtml;
                selectTrans.innerHTML += optionHtml;

                const lessonDiv = document.createElement('div');
                lessonDiv.className = 'lesson-container';
                lessonDiv.id = `lesson-${lesson.lesson}`;
                
                lessonDiv.innerHTML = `<h2 class="lesson-title">Bài ${lesson.lesson}: ${lesson.title}</h2>`;
                
                // Vocab
                if(lesson.vocab && lesson.vocab.length > 0) {
                    let vocabHtml = `<h3 class="section-title">📚 Từ vựng & Mở rộng</h3><div class="grid">`;
                    lesson.vocab.forEach((word, index) => {
                        let exampleHtml = '';
                        if(word.example) {
                            exampleHtml = `
                                <div class="example">
                                    <div class="ex-hanzi">
                                        <span>${word.example.hanzi}</span>
                                        <span class="speaker-icon" onclick="event.stopPropagation(); speak('${word.example.hanzi}')">🔊</span>
                                    </div>
                                    <div class="ex-pinyin">${word.example.pinyin}</div>
                                    <div class="ex-meaning">${word.example.vi}</div>
                                </div>
                            `;
                        }
                        
                        vocabHtml += `
                            <div class="card" onclick="openStrokeModal('${word.hanzi}')" title="Click để xem cách viết">
                                <div class="card-actions">
                                    <span class="btn-edit" title="Sửa từ này" onclick="event.stopPropagation(); editVocab(${lesson.lesson}, ${index})">✏️</span>
                                    <span class="btn-del" title="Xóa từ này" onclick="event.stopPropagation(); deleteVocab(event, ${lesson.lesson}, ${index})">🗑️</span>
                                </div>
                                <div class="hanzi-row">
                                    <div class="hanzi">${word.hanzi}</div>
                                    <span class="speaker-icon" onclick="event.stopPropagation(); speak('${word.hanzi}')" title="Nghe phát âm">🔊</span>
                                </div>
                                <div class="pinyin">${word.pinyin || ''}</div>
                                <div class="meaning">${word.vi}</div>
                                ${exampleHtml}
                            </div>
                        `;
                    });
                    vocabHtml += `</div>`;
                    lessonDiv.innerHTML += vocabHtml;
                } else {
                    lessonDiv.innerHTML += `<p style="color:#888; font-style:italic;">Chưa có từ vựng nào trong bài này.</p>`;
                }
                
                // Translations
                if(lesson.translations && lesson.translations.length > 0) {
                    let transHtml = `<div class="translation-section">
                        <h3 class="section-title">✍️ Bài tập dịch (Việt - Trung)</h3>
                    `;
                    
                    lesson.translations.forEach((item, index) => {
                        const inputId = `input-L${lesson.lesson}-T${index}`;
                        const resId = `res-L${lesson.lesson}-T${index}`;
                        const cleanZh = item.zh.replace(/[.,!?，。！？]/g, "").trim();
                        
                        transHtml += `
                            <div class="translation-item">
                                <div class="trans-actions">
                                    <span class="btn-edit" title="Sửa câu này" onclick="editTranslation(${lesson.lesson}, ${index})">✏️</span>
                                    <span class="btn-del" title="Xóa câu này" onclick="deleteTranslation(${lesson.lesson}, ${index})">🗑️</span>
                                </div>
                                <div class="trans-vi">${index + 1}. ${item.vi}</div>
                                <div class="input-group">
                                    <textarea id="${inputId}" class="trans-textarea" placeholder="Nhập câu tiếng Trung của bạn (Hán tự)..."></textarea>
                                    <button class="btn-check" onclick="checkTranslation('${inputId}', '${resId}', '${cleanZh}')">Kiểm tra</button>
                                    <button class="btn-show" onclick="showAnswer('${resId}', '${item.zh}')">Xem đáp án</button>
                                </div>
                                <div id="${resId}" class="result-box"></div>
                            </div>
                        `;
                    });
                    transHtml += `</div>`;
                    lessonDiv.innerHTML += transHtml;
                }
                
                app.appendChild(lessonDiv);
            });

            if (currentVocabLesson) selectVocab.value = currentVocabLesson;
            if (currentTransLesson) selectTrans.value = currentTransLesson;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        document.querySelectorAll('.nav-links a').forEach(a => {
                            if (a.getAttribute('href'] === `#${id}`) {
                                a.classList.add('active');
                            } else {
                                a.classList.remove('active');
                            }
                        });
                    }
                });
            }, { threshold: 0.2 });

        // CẢI THIỆN GIỌNG ĐỌC: Ưu tiên SpeechSynthesis với giọng nữ tiếng Trung mượt mà, fallback sang Google TTS
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9; // Tốc độ vừa phải, tự nhiên hơn
                
                const voices = window.speechSynthesis.getVoices();
                // Ưu tiên chọn giọng nữ Trung Quốc (Microsoft Huihui, Google 普通话, v.v.)
                const zhVoice = voices.find(v => v.lang === 'zh-CN' && (v.name.includes('Huihui') || v.name.includes('Female') || v.name.includes('Xiaoxiao') || v.name.includes('Google')));
                if (zhVoice) {
                    utterance.voice = zhVoice;
                }
                
                window.speechSynthesis.speak(utterance);
            } else {
                const encodedText = encodeURIComponent(text);
                const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=zh-CN&client=tw-ob`;
                const audio = new Audio(audioUrl);
                audio.play().catch(e => console.error("Lỗi phát âm:", e));
            }
        }
        // Đảm bảo load sẵn danh sách giọng nói của trình duyệt
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        function calculateSimilarity(s1, s2) {
            if (!s1 || !s2) return 0;
            let longer = s1.length >= s2.length ? s1 : s2;
            let shorter = s1.length < s2.length ? s1 : s2;
            let longerLength = longer.length;
            if (longerLength === 0) return 100;
            
            let costs = new Array();
            for (let i = 0; i <= longer.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= shorter.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (longer.charAt(i - 1) != shorter.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[shorter.length] = lastValue;
            }
            return Math.round(((longerLength - costs[shorter.length]) / parseFloat(longerLength)) * 100);
        }

        function checkTranslation(inputId, resId, correctString) {
            let inputVal = document.getElementById(inputId).value.replace(/[.,!?，。！？\s]/g, "").trim();
            let cleanCorrect = correctString.replace(/[.,!?，。！？\s]/g, "").trim();
            const resBox = document.getElementById(resId);
            if(inputVal === "") return;
            
            const simScore = calculateSimilarity(inputVal, cleanCorrect);
            
            if(simScore >= 80) {
                resBox.className = "result-box correct";
                resBox.innerHTML = `✨ OK! (Độ chính xác: ${simScore}%) 🔊 <span class='speaker-icon' style='cursor:pointer' onclick="speak('${correctString}')">Nghe đáp án mẫu</span>`;
            } else {
                resBox.className = "result-box show-answer";
                resBox.innerHTML = `⚠️ Chưa đạt (Độ chính xác: ${simScore}%). Một câu có thể có nhiều cách dịch, hãy thử lại hoặc xem đáp án.`;
            }
        }

        let writers = [];
        function openStrokeModal(hanzi) {
            const modal = document.getElementById('stroke-modal');
            const container = document.getElementById('stroke-container');
            const title = document.getElementById('stroke-word');
            
            title.textContent = hanzi;
            container.innerHTML = '';
            writers = [];
            
            const chars = hanzi.match(/[\u4e00-\u9fa5]/g) || [];
            
            if (chars.length === 0) {
                container.innerHTML = '<p style="color:red;">Không có Hán tự để hiển thị nét chữ.</p>';
            } else {
                chars.forEach(char => {
                    const box = document.createElement('div');
                    box.className = 'hanzi-box';
                    container.appendChild(box);
                    
                    const writer = HanziWriter.create(box, char, {
                        width: 120,
                        height: 120,
                        padding: 10,
                        strokeAnimationSpeed: 1,
                        delayBetweenStrokes: 200,
                        showOutline: true
                    });
                    writers.push(writer);
                });
            }
            
            modal.style.display = 'flex';
            setTimeout(animateAllStrokes, 500);
        }
        
        function closeStrokeModal() {
            document.getElementById('stroke-modal').style.display = 'none';
            writers = [];
        }

        function animateAllStrokes() {
            writers.forEach(writer => writer.animateCharacter());
        }
        
        window.onclick = function(event) {
            const modal = document.getElementById('stroke-modal');
            if (event.target == modal) {
                closeStrokeModal();
            }
        }

        let lastScrollPosition = 0;
        let isSearching = false;

        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');

        searchInput.addEventListener('input', function(e) {
            const query = e.target.value.trim().toLowerCase();
            if (query === '') {
                clearSearch();
            } else {
                if (!isSearching) {
                    lastScrollPosition = window.scrollY;
                    isSearching = true;
                }
                clearSearchBtn.style.display = 'block';
                renderSearchResults(query);
                window.scrollTo(0, 0);
            }
        });

        clearSearchBtn.addEventListener('click', clearSearch);

        function clearSearch() {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            renderApp();
            if (isSearching) {
                window.scrollTo(0, lastScrollPosition);
                isSearching = false;
            }
